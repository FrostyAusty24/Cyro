services:
  cyro:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 3000
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
